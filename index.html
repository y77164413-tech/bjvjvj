<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوّنها | دفاتر تلوين من صورك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FF;--card:#FFFFFF;--ink:#1E1B4B;--muted:#5E5A8C;--line:#DCD7F6;
  --pink:#E31B6D;--sun:#FFC52E;--mint:#22BFA0;--sky:#3B82F6;--violet:#7C4DFF;
  --soft:#EAE5FF;--ok:#0E8A62;--warn:#B45309;--bad:#C62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12102B;--card:#1C1941;--ink:#F2F0FF;--muted:#B3AEDF;--line:#37336E;--soft:#26225A;--pink:#FF5C93;--ok:#3DDBA6;--warn:#FBBF24;--bad:#FF8A8A}
}
:root[data-theme="dark"]{--bg:#12102B;--card:#1C1941;--ink:#F2F0FF;--muted:#B3AEDF;--line:#37336E;--soft:#26225A;--pink:#FF5C93;--ok:#3DDBA6;--warn:#FBBF24;--bad:#FF8A8A}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,Tahoma,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:400;line-height:1.25;margin:0}
a{color:inherit}
img{max-width:100%}
.muted{color:var(--muted)}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}

/* buttons */
.btn{font:600 1rem/1.2 inherit;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.3rem;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:.4rem .85rem;font-size:.9rem;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* top */
.adbar{display:flex;flex-wrap:wrap;gap:.2rem 1.6rem;justify-content:center;padding:.5rem 14px;color:#fff;font-weight:600;font-size:.92rem}
.adbar a{text-decoration:underline;text-underline-offset:3px}
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-family:'Lalezar',sans-serif;font-size:1.9rem;text-decoration:none;display:flex;align-items:center;gap:8px;line-height:1}
.logo i{display:inline-block;width:30px;height:30px;border-radius:9px;background:conic-gradient(var(--pink),var(--sun),var(--mint),var(--sky),var(--violet),var(--pink));border:2px solid var(--ink)}
.links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.links a{padding:.4rem .8rem;border-radius:999px;text-decoration:none;font-weight:500}
.links a:hover,.links a.on{background:var(--soft)}
.cartbtn{position:relative}
.cartbtn b{background:var(--ink);color:var(--bg);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.8rem;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:44px 0 36px}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em;margin:16px 0 24px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.sheet{position:relative;background:#fff;border:2px solid #1E1B4B;border-radius:18px;padding:14px 14px 14px 34px;box-shadow:8px 8px 0 #1E1B4B;color:#1E1B4B;max-width:470px;margin-inline:auto;width:100%}
.sheet::before{content:"";position:absolute;inset:14px auto 14px 8px;width:16px;background:radial-gradient(circle at 50% 50%,#1E1B4B 0 4.5px,transparent 5.5px) 0 0/16px 30px repeat-y}
.sheet svg{display:block;width:100%;height:auto;stroke:#1E1B4B;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.reg{cursor:pointer;transition:fill .18s}
.reg:hover{opacity:.82}
.sw-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #1E1B4B;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px #1E1B4B;transform:scale(1.08)}
.sheet .hint{font-size:.85rem;text-align:center;margin:8px 0 0;color:#4B4780}
.sheet .rs{background:none;border:0;color:#4B4780;text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem}

/* sections */
section.s{padding:36px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sh h2{font-size:clamp(1.8rem,4vw,2.5rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:1/.82;display:grid;place-items:center;color:#1E1B4B}
.cover svg{width:56%;height:auto}
.pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:1.35rem}
.pb p{margin:0;font-size:.93rem}
.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px}
.pf b{font-size:1.1rem}

.custom{background:var(--card);border:2px solid var(--ink);border-radius:26px;padding:34px;display:grid;grid-template-columns:1fr 1.2fr;gap:30px;align-items:center}
.custom h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.plan{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--bg);cursor:pointer;text-align:start;font:inherit;color:inherit;display:block;width:100%}
.plan[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);box-shadow:3px 3px 0 var(--ink)}
.plan h4{font-size:1.25rem}
.plan .pr{font-size:1.3rem;font-weight:700;margin-top:6px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:st}
.step{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative}
.step::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sun);color:#1E1B4B;font-family:'Lalezar';font-size:1.3rem;border:2px solid var(--ink);margin-bottom:10px}
.step h4{font-size:1.25rem;margin-bottom:4px}
.banner{border-radius:22px;padding:28px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.banner h3{font-size:1.8rem}
.banner .btn{background:#fff;color:#1E1B4B}

/* footer */
footer{margin-top:50px;border-top:1px solid var(--line);padding:34px 0 50px;background:var(--card)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
footer h4{font-size:1.2rem;margin-bottom:8px}
footer p,footer li{margin:2px 0;font-size:.95rem}
footer ul{list-style:none;padding:0;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;font-size:.88rem;background:var(--bg)}

/* forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
label.f{display:block;font-weight:600;font-size:.93rem;margin-bottom:12px}
label.f span.h{font-weight:400;color:var(--muted);font-size:.85rem;display:block}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=email],input[type=search],input[type=url],select,textarea{width:100%;margin-top:5px;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{width:60px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);margin-top:5px;padding:2px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--violet);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.checkout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.pm{display:block;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:var(--bg)}
.pm:has(input:checked){border-color:var(--ink);background:var(--soft)}
.pm input{accent-color:var(--pink);margin-inline-end:8px}
.pm small{display:block;color:var(--muted);margin-inline-start:26px}
.paybox{border:2px dashed var(--ink);border-radius:14px;padding:16px;margin:14px 0;background:var(--card)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center;flex-wrap:wrap}
.kv:last-child{border:0}
.kv code{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:.1rem .5rem;border-radius:8px;word-break:break-all}
.upl{display:block;border:2px dashed var(--muted);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--bg)}
.upl.ok{border-color:var(--ok);border-style:solid}
.upl input{display:none}
.apay,.gpay{width:100%;padding:.85rem;border-radius:12px;border:0;font:600 1.05rem inherit;font-family:inherit;cursor:default;margin-top:6px}
.apay{background:#000;color:#fff}
.gpay{background:#fff;color:#3c4043;border:1px solid #dadce0}
.err{color:var(--bad);font-weight:600;margin:8px 0;min-height:1.2em}
.sum .kv b{font-size:1rem}
.sum .tot{font-size:1.25rem;font-weight:700}
.crow{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow .th{width:76px;height:76px;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#1E1B4B}
.crow .th svg{width:60%}
.crow .th img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:1.1rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumbs button{position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.done{text-align:center;padding:50px 20px}
.done .big{font-family:'Lalezar';font-size:2.4rem}
.oid{display:inline-block;direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;background:var(--sun);color:#1E1B4B;border:2px solid var(--ink);padding:.2rem 1rem;border-radius:12px;margin:10px 0}

/* admin */
.adm h1{font-size:2rem;margin:20px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;border:0;background:none;color:var(--muted);font:600 .98rem inherit;font-family:inherit;padding:.55rem 1rem;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.6rem;font-family:'Lalezar';font-weight:400}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:.7rem .9rem;text-align:start;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:middle}
th{color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;font-size:.88rem}
.st i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input,.bar select{margin:0;width:auto;min-width:180px}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .9rem;cursor:pointer;font:inherit;font-size:.9rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alert{background:var(--sun);color:#1E1B4B;border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.demo{background:var(--soft);border:1px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:.9rem}
.setg{margin-bottom:22px}
.setg h3{font-size:1.4rem;margin-bottom:10px}
.setg .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 16px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:12px}
.chk input{width:20px;height:20px;accent-color:var(--pink)}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;background:rgba(18,16,43,.6);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:8px 8px 0 var(--ink)}
.mbox h3{font-size:1.6rem;margin-bottom:12px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mbox img.full{width:100%;border-radius:12px}
#toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:120}
#toast span{background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s}
#toast.on span{opacity:1;transform:none}

@media (max-width:860px){
  .hero,.custom,.checkout{grid-template-columns:1fr}
  .hero{padding-top:24px}
  .custom{padding:22px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hasCrypto=()=>!!(window.crypto&&window.crypto.subtle);
async function pbk(pw,salt,it){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256));
}
function eq(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0}
async function mkAuth(u,pw){const salt=crypto.getRandomValues(new Uint8Array(16));const it=150000;return{u:u.toLowerCase(),salt:b64(salt),it,h:await pbk(pw,salt,it)}}
async function checkAuth(u,pw){const a=S.auth;const h=await pbk(pw,unb64(a.salt),a.it);const okU=eq(String(u).toLowerCase(),a.u);const okP=eq(h,a.h);return okU&&okP}

async function doLogin(f){
  const err=$('#aerr');err.textContent='';
  if(!hasCrypto()){err.textContent='المتصفح لا يدعم التشفير المطلوب.';return}
  let lock=0;try{lock=+localStorage.getItem('lw_lock')||0}catch(x){}
  if(lock>Date.now()){err.textContent='محاولات كثيرة. انتظر '+Math.ceil((lock-Date.now())/1000)+' ثانية.';return}
  if(!f.u.value.trim()||!f.p.value){err.textContent='اكتب اسم المستخدم وكلمة السر.';return}
  let ok=false;try{ok=await checkAuth(f.u.value.trim(),f.p.value)}catch(x){}
  if(ok){S.fail=0;S.authed=true;try{sessionStorage.setItem('lw_ok','1')}catch(x){}render();return}
  S.fail++;
  if(S.fail>=5){S.fail=0;try{localStorage.setItem('lw_lock',String(Date.now()+60000))}catch(x){}err.textContent='محاولات كثيرة. حاول بعد دقيقة.'}
  else err.textContent='اسم المستخدم أو كلمة السر غير صحيحة.';
}

/* ---------- image helpers ---------- */
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function compress(file,maxDim=1000,q=.6,maxChars=170000){
  const src=await readFile(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  let d=maxDim,out=src;
  for(let n=0;n<7;n++){
    const sc=Math.min(1,d/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<=maxChars)break;d*=.8;q=Math.max(.4,q-.07);
  }
  return out;
}

function codeInfo(code){
  code=(code||'').trim().toUpperCase();if(!code)return null;
  const c=S.cfg.coupons.find(x=>x.active&&String(x.code).toUpperCase()===code);
  if(c)return{code:c.code,kind:'coupon',type:c.type,value:+c.value||0,min:+c.min||0,ref:c.id};
  const p=S.cfg.partners.find(x=>x.active&&String(x.code).toUpperCase()===code);
  if(p)return{code:p.code,kind:'partner',type:'percent',value:+p.disc||0,min:0,ref:p.id,partner:p.name};
  return null;
}
function totals(){
  const sub=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const ci=S.code?codeInfo(S.code):null;
  let disc=0;
  if(ci&&sub>=ci.min)disc=ci.type==='percent'?sub*ci.value/100:Math.min(ci.value,sub);
  const after=sub-disc;
  const ship=!S.cart.length?0:(after>=(+S.cfg.ship.free||0)&&+S.cfg.ship.free>0?0:(+S.cfg.ship.fee||0));
  return{sub,disc,ship,total:after+ship,ci};
}
function addItem(it){
  const ex=S.cart.find(x=>x.k===it.k);
  if(ex&&it.type==='p')ex.qty=Math.min(20,ex.qty+1);else S.cart.push(it);
  saveCart();updCount();
}

function wireCheckout(){
  const f=$('#ck');if(!f)return;
  const sync=()=>{
    const m=f.pm.value;
    f.querySelectorAll('[data-pay]').forEach(e=>{
      const k=e.dataset.pay;
      e.hidden=!(k===m||(k==='proof'&&(m==='bank'||m==='cliq')));
    });
    $('#subBtn').hidden=(m==='apple'||m==='google')?false:false;
  };
  f.querySelectorAll('input[name=pm]').forEach(r=>r.addEventListener('change',sync));sync();
  f.proof.addEventListener('change',()=>{const fl=f.proof.files[0];$('#proofName').textContent=fl?('تم اختيار: '+fl.name):'مطلوب لإتمام الطلب.';$('#proofBox').classList.toggle('ok',!!fl)});
  f.addEventListener('submit',submitOrder);
}
async function submitOrder(e){
  e.preventDefault();
  const f=e.target,err=$('#cke'),btn=$('#subBtn');
  err.textContent='';
  const v=n=>f[n].value.trim();
  if(!v('name')||!v('phone')||!v('addr')){err.textContent='عبّئ الاسم والهاتف والعنوان.';return}
  if(!/^[0-9+\s-]{8,16}$/.test(v('phone'))){err.textContent='رقم الهاتف غير صحيح.';return}
  const method=f.pm.value,transfer=(method==='bank'||method==='cliq');
  let proof=null;
  if(transfer){
    if(!v('sender')){err.textContent='اكتب اسم المحوِّل أو رقم العملية.';return}
    if(!f.proof.files[0]){err.textContent='صورة إثبات التحويل مطلوبة لإتمام الطلب.';return}
  }
  if(S.mode==='cloud'&&!UID){err.textContent='سجّل دخولك لإرسال الطلب.';return}
  btn.disabled=true;btn.textContent='جارٍ إرسال الطلب…';
  try{
    if(transfer)proof=await compress(f.proof.files[0],S.mode==='cloud'?1100:800,.6,S.mode==='cloud'?180000:90000);
    const photos=[];S.cart.forEach(i=>{if(i.type==='c')i.photos.forEach(p=>photos.push(p))});
    const t=totals();
    const meta={id:'LW-'+String(Date.now()).slice(-6)+rid().slice(0,2).toUpperCase(),ts:Date.now(),
      items:S.cart.map(i=>({n:i.name,q:i.qty,p:i.price,t:i.type,title:i.title||'',notes:i.notes||'',pc:i.photos?i.photos.length:0})),
      cu:{name:v('name'),phone:v('phone'),email:v('email'),city:v('city')||f.city.value,addr:v('addr'),notes:v('notes')},
      sub:t.sub,disc:t.disc,code:t.ci?t.ci.code:'',partner:t.ci&&t.ci.kind==='partner'?t.ci.ref:'',ship:t.ship,total:t.total,
      method,sender:transfer?v('sender'):'',pc:photos.length,status:transfer?'pending':'awaiting_gateway'};
    await saveOrder(meta,proof,photos);
    S.done=meta;S.cart=[];S.code='';saveCart();
    location.hash='#/done';
  }catch(ex){
    err.textContent='تعذّر إرسال الطلب: '+(ex&&ex.message?ex.message:'حاول مرة أخرى');
    btn.disabled=false;btn.textContent='تأكيد الطلب';
  }
}

async function doTrack(){
  const id=$('#trk').value.trim().toUpperCase();const out=$('#trkOut');
  if(!id){out.innerHTML='<p class="err">اكتب رقم الطلب.</p>';return}
  let s=null,found=false;
  try{
    if(S.mode==='cloud'){const d=await DB.doc('orderStatus/'+id.replace(/[^A-Z0-9-]/g,'')).get();if(d.exists){s=d.data().status;found=true}}
    else{const o=S.orders.find(x=>x.id===id);if(o){s=o.status;found=true}else{out.innerHTML='<p class="err">لم نجد طلباً بهذا الرقم.</p>';return}}
  }catch(e){}
  const l=s?(ST[s]||[s,'#999']):null;
  out.innerHTML=found?`<p><span class="st"><i style="background:${l[1]}"></i>${esc(l[0])}</span></p>`:'<p class="muted">لا توجد تحديثات على هذا الطلب بعد. إذا أرسلته للتو فهو قيد المراجعة.</p>';

  track:doTrack,
  tab(t){S.tab=t.dataset.k;render()},
  ofilter(t){S.of=t.dataset.k;render()},
  pfilter(t){S.payFilter=t.dataset.k;render()},
  openOrder(t){openOrder(t.dataset.id)},
  proof(t){openOrder(t.dataset.id,true)},
  setSt(t){setStatus(t.dataset.id,t.dataset.s)},
  setStClose(t){closeM();setStatus(t.dataset.id,t.dataset.s)},
  stSave(t){const v=$('#stSel').value;closeM();setStatus(t.dataset.id,v)},
  prodEdit(t){editList('products','إضافة تصميم',[{k:'name',l:'اسم التصميم'},{k:'desc',l:'وصف قصير'},{k:'price',l:'السعر (د.أ)',t:'number'},{k:'pages',l:'عدد الصفحات',t:'number'},{k:'art',l:'الرسمة على الغلاف',t:'select',o:[[0,'زهرة'],[1,'قط'],[2,'بالون'],[3,'بيت'],[4,'سمكة'],[5,'صاروخ']]},{k:'active',l:'ظاهر في المتجر',t:'check'}],{name:'',desc:'',price:5,pages:20,art:0,active:true},t.dataset.id)},
  prodDel(t){delFrom('products',t.dataset.id,'حذف هذا التصميم من المتجر؟')},
  planEdit(t){editList('plans','إضافة حجم',[{k:'name',l:'اسم الحجم'},{k:'photos',l:'أقصى عدد للصور',t:'number'},{k:'pages',l:'عدد الصفحات',t:'number'},{k:'price',l:'السعر (د.أ)',t:'number'}],{name:'',photos:10,pages:12,price:10},t.dataset.id)},
  planDel(t){delFrom('plans',t.dataset.id,'حذف هذا الحجم؟')},
  cpEdit(t){editList('coupons','إضافة كود خصم',[{k:'code',l:'الكود',dir:1,h:'حروف إنجليزية وأرقام'},{k:'type',l:'نوع الخصم',t:'select',o:[['percent','نسبة مئوية %'],['fixed','مبلغ ثابت د.أ']]},{k:'value',l:'قيمة الخصم',t:'number'},{k:'min',l:'أقل قيمة للطلب (0 = بدون حد)',t:'number'},{k:'active',l:'فعّال',t:'check'}],{code:'',type:'percent',value:10,min:0,active:true},t.dataset.id)},
  cpDel(t){delFrom('coupons',t.dataset.id,'حذف كود الخصم؟')},
  ptEdit(t){editList('partners','إضافة شريك',[{k:'name',l:'اسم الشريك'},{k:'phone',l:'رقم هاتف الشريك',dir:1},{k:'code',l:'كود الشريك',dir:1},{k:'disc',l:'نسبة خصم العميل %',t:'number'},{k:'comm',l:'نسبة عمولة الشريك %',t:'number'},{k:'active',l:'فعّال',t:'check'}],{name:'',phone:'',code:'',disc:10,comm:10,active:true},t.dataset.id)},
  ptDel(t){delFrom('partners',t.dataset.id,'حذف هذا الشريك؟')},
  adEdit(t){editList('ads','إضافة إعلان',[{k:'kind',l:'نوع الإعلان',t:'select',o:[['bar','شريط علوي'],['banner','بانر في الرئيسية']]},{k:'title',l:'العنوان (للبانر)'},{k:'text',l:'النص'},{k:'btn',l:'نص الزر (للبانر)'},{k:'link',l:'الرابط (اختياري)',dir:1,h:'مثال: #/shop أو https://…'},{k:'color',l:'اللون',t:'color'},{k:'active',l:'ظاهر',t:'check'}],{kind:'bar',title:'',text:'',btn:'',link:'',color:'#1E1B4B',active:true},t.dataset.id)},
  adDel(t){delFrom('ads',t.dataset.id,'حذف هذا الإعلان؟')}
};

/* ---------- render ---------- */
function render(){
  const r=route();let body='';
  switch(r){
    case 'shop':body=vShop();break;
    case 'custom':body=vCustom();break;
    case 'cart':body=vCart();break;
    case 'checkout':body=vCheckout();break;
    case 'done':body=vDone();break;
    case 'track':body=vTrack();break;
    case 'admin':body=vAdmin();break;
    default:body=vHome();
  }
  if(r==='checkout'&&!body)return;
  const sy=window.scrollY;
  $('#app').innerHTML=chrome(body,r);
  document.title=S.cfg.info.name+' | '+S.cfg.info.tagline;
  if(r==='checkout')wireCheckout();
  if(r==='admin'&&S.tab==='settings'){const f=$('#sf');if(f)f.addEventListener('submit',saveSettings)}
  if(S.rt){S.rt=false}else window.scrollTo(0,sy);
}
function saveSettings(e){
  e.preventDefault();
  SET.forEach(([g,fs])=>fs.forEach(([p,l,t])=>{
    const el=$(`#sf [name="${p}"]`);if(!el)return;
    setPath(S.cfg,p,t==='check'?el.checked:t==='num'?(parseFloat(el.value)||0):el.value.trim());
  }));
  saveCfg('تم حفظ معلومات المتجر');
}
window.addEventListener('hashchange',()=>{S.rt=true;render();window.scrollTo(0,0)});

document.addEventListener('click',e=>{
  const reg=e.target.closest&&e.target.closest('.reg');
  if(reg){S.fills[reg.dataset.id]=S.color;reg.setAttribute('fill',S.color);return}
  const t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a]){A[t.dataset.a](t,e)}
  else if(e.target.id==='modal')closeM();
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='lf'){e.preventDefault();doLogin(f)}
  else if(f.id==='su'){e.preventDefault();doSetup(f)}
  else if(f.id==='af'){e.preventDefault();doAccount(f)}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('reg')){e.preventDefault();S.fills[e.target.dataset.id]=S.color;e.target.setAttribute('fill',S.color)}
  if(e.key==='Escape')closeM();
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  if(b==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('[data-bind="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  else if(b==='cust.title')S.cust.title=e.target.value;
  else if(b==='cust.notes')S.cust.notes=e.target.value;
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.aChange==='photos'){
    const plan=byId(S.cfg.plans,S.cust.plan)||S.cfg.plans[0];
    const files=[...e.target.files];let skipped=0;
    toast('جارٍ تجهيز الصور…');
    for(const f of files){
      if(S.cust.photos.length>=plan.photos){skipped++;continue}
      try{S.cust.photos.push(await compress(f,900,.6,S.mode==='cloud'?150000:40000))}catch(x){skipped++}
    }
    render();
    if(skipped)toast('تم تجاهل '+skipped+' صورة (الحد الأقصى '+plan.photos+' أو ملف غير صالح)');
  }
});

try{S.cart=lget('lw_cart',[]).filter(i=>i&&i.type==='p')}catch(e){}
render();
initStore();
})();
</script>
</body>
</html>
